name: Deploy Quvex Cast Receiver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "receiver.css"
      - "receiver.js"
      - "assets/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "receiver.css"
      - "receiver.js"
      - "assets/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: quvex-cast-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate receiver JavaScript
        run: node --check receiver.js
      - name: Validate required site assets
        shell: bash
        run: |
          test -s index.html
          test -s receiver.css
          test -s receiver.js
          test -s assets/quvex-mark.svg

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage receiver-only site
        shell: bash
        run: |
          mkdir _site
          cp index.html receiver.css receiver.js .nojekyll _site/
          cp -R assets _site/assets
      - name: Upload receiver site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
